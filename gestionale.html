            <div className="sem">{grid.map(d=>(<div className="dom" key={d.dominio}><b><span className={"dot "+d.livello}></span>{d.dominio}</b><small>{d.nota}</small>{d.fonti&&d.fonti.length>0&&<div style={{marginTop:6}}><Srcs list={d.fonti} /></div>}</div>))}</div>
            <div className="repsec"><h3>1 · Informazioni odontoiatriche rilevanti</h3><ul>{rep.odo.map((x,i)=><li key={i}>{x}</li>)}</ul></div>
            <div className="repsec"><h3>2 · Informazioni muscolo-scheletriche e posturali</h3><ul>{rep.mss.map((x,i)=><li key={i}>{x}</li>)}</ul></div>
            <div className="repsec"><h3>3 · Possibili correlazioni cranio-cervico-mandibolari <span className="pill">ipotesi</span></h3><ul>{rep.correlazioni.map((x,i)=><li className="ipotesi" key={i}>{x}</li>)}</ul></div>
            <div className="repsec"><h3>4 · Bandiere rosse / da approfondire</h3>{rep.red.length?<div className="redbox"><ul>{rep.red.map((x,i)=><li key={i}><b>{x.etichetta}</b> <Src f={x.fonte} />{x.dettaglio?" — "+x.dettaglio:""}</li>)}</ul></div>:<ul><li>Nessuna bandiera rossa rilevata.</li></ul>}</div>
            <div className="repsec"><h3>5 · Priorita di valutazione in studio</h3>{rep.priorita.length?<ol>{rep.priorita.map((d,i)=><li key={i}><b>{d.dominio}</b> <span className={"dot "+d.livello}></span> — {d.nota} <Srcs list={d.fonti} /></li>)}</ol>:<ul><li>Protocollo SSDC standard.</li></ul>}</div>
            {exams.length>0&&<div className="repsec"><h3>Allegati del paziente</h3>{exams.map((e,i)=>{const nm=typeof e==="string"?e:e.name;return(<div className="exam" key={i}><span className="fi">{(nm.split(".").pop()||"").toUpperCase().slice(0,4)}</span><span>{nm}</span></div>);})}</div>}
            {(()=>{const ns=collectNotes({odontoiatra:lastVisit.odontoiatra,fisioterapista:lastVisit.fisioterapista});return ns.length>0?(<div className="repsec"><h3>Note dei clinici (voce per voce)</h3><ul>{ns.map((x,i)=><li key={i}><b>{x.label}</b> <Src f={x.sez} /> — {x.nota}</li>)}</ul></div>):null;})()}
            </div>}
            <div className="repsec"><h3>Nota / conclusione clinica libera</h3>
              <p className="note" style={{marginTop:0}}>Testo scritto da voi, separato da quanto calcolato automaticamente sopra.</p>
              <div className="f wide"><textarea style={{minHeight:90}} value={v.nota_report||""} onChange={e=>setVal(s=>({...s,nota_report:e.target.value}))} placeholder="Es. conclusioni della visita, indicazioni concordate col paziente…" /></div>
              <div className="savebar"><button className="btn primary" onClick={save}>Salva nota</button>{saved&&<span className="savemsg">{saved}</span>}</div>
            </div>
          </div>}

          {tab==="specialisti"&&<div>
            <h2>Altri specialisti da consultare</h2>
            <p className="note" style={{marginTop:4}}>Suggerimenti calcolati incrociando anamnesi, visita odontoiatrica e fisioterapica (ultima visita disponibile). Sono spunti di lavoro: la decisione finale resta al clinico.</p>
            {specialisti.length===0?<p className="note">Nessun segnale che al momento suggerisca il coinvolgimento di altri specialisti.</p>:
              <div className="repsec"><ul>{specialisti.map((s,i)=><li key={i}><span className={"dot "+s.livello}></span> <b>{s.spec}</b> — {s.motivo}</li>)}</ul></div>}
            <div className="savebar"><button className="btn ghost" onClick={()=>window.print()}>Stampa / PDF</button></div>
          </div>}

          {tab==="odo"&&<div>
            <h2>Valutazione odontoiatrica</h2>
            <VisitBar />
            {val!==null&&<div className="visitmeta"><label>Data di questa visita <input type="date" value={activeVisit.data||""} onChange={e=>setVisitDate(e.target.value)} /></label>{visite.length>1&&<button className="notebtn" onClick={()=>deleteVisit(activeVisitId)}>Elimina questa visita</button>}</div>}
            {val!==null&&<div style={{marginBottom:18}}>
              <div className="grp" style={{borderTop:"none",paddingTop:0,marginTop:0}}>Diagnosi di altri specialisti rilevanti per questa visita</div>
              <DiagnosiSpecialistiTesto list={(activeVisit.odontoiatra||{}).diagnosi_specialisti} onChange={list=>setODO("diagnosi_specialisti",list)} />
            </div>}
            {val===null?<p className="note">Caricamento…</p>:<ClinForm fields={ODO} data={activeVisit.odontoiatra||{}} onSet={setODO} />}
            <div className="savebar"><button className="btn primary" onClick={save}>Salva valutazione</button>{saved&&<span className="savemsg">{saved}</span>}</div>
          </div>}

          {tab==="triage"&&<div>
            <h2>Serve il fisioterapista?</h2>
            <p className="note" style={{marginTop:4,marginBottom:0}}>Valutazione basata sull'anamnesi e sulla visita odontoiatrica di questa visita. Pensata per essere mostrata e spiegata al paziente in studio.</p>
            <VisitBar />
            <div className={"trafficbig "+triage.livello}>
              <div className="tbdot"></div>
              <div className="tbtext">
                {triage.livello==="verde"&&<><b>Nessun segnale evidente</b><span>Al momento non emergono elementi che richiedano una valutazione fisioterapica.</span></>}
                {triage.livello==="giallo"&&<><b>Alcuni segnali da monitorare</b><span>Ti consigliamo una valutazione fisioterapica di controllo, anche solo preventiva.</span></>}
                {triage.livello==="rosso"&&<><b>Segnali significativi</b><span>Ti consigliamo una valutazione fisioterapica specifica, in collaborazione con il percorso odontoiatrico.</span></>}
              </div>
            </div>
            {triage.motivi.length>0&&<div className="repsec"><h3>Cosa abbiamo osservato</h3><ul>{triage.motivi.map((f,i)=><li key={i}>{explainFlag(f.etichetta,FISIO_TRIAGE_SPIEGA)}</li>)}</ul></div>}
            <div className="savebar"><button className="btn ghost" onClick={()=>window.print()}>Stampa / Mostra al paziente</button></div>
          </div>}

          {tab==="fisio"&&<div>
            <h2>Valutazione fisioterapica</h2>
            <VisitBar />
            {val!==null&&<div className="visitmeta"><label>Data di questa visita <input type="date" value={activeVisit.data||""} onChange={e=>setVisitDate(e.target.value)} /></label>{visite.length>1&&<button className="notebtn" onClick={()=>deleteVisit(activeVisitId)}>Elimina questa visita</button>}</div>}
            {val!==null&&<div style={{marginBottom:18}}>
              <div className="grp" style={{borderTop:"none",paddingTop:0,marginTop:0}}>Diagnosi di altri specialisti rilevanti per questa visita</div>
              <DiagnosiSpecialistiTesto list={(activeVisit.fisioterapista||{}).diagnosi_specialisti} onChange={list=>setFIS("diagnosi_specialisti",list)} />
            </div>}
            {val===null?<p className="note">Caricamento…</p>:<ClinForm fields={FISIO} data={activeVisit.fisioterapista||{}} onSet={setFIS} />}
            <div className="savebar"><button className="btn primary" onClick={save}>Salva valutazione</button>{saved&&<span className="savemsg">{saved}</span>}</div>
          </div>}

          {tab==="triage2"&&<div>
            <h2>Serve l'odontoiatra?</h2>
            <p className="note" style={{marginTop:4,marginBottom:0}}>Valutazione basata sull'anamnesi e sulla visita fisioterapica di questa visita. Pensata per essere mostrata e spiegata al paziente in studio.</p>
            <VisitBar />
            <div className={"trafficbig "+triageOd.livello}>
              <div className="tbdot"></div>
              <div className="tbtext">
                {triageOd.livello==="verde"&&<><b>Nessun segnale evidente</b><span>Al momento non emergono elementi che richiedano una valutazione odontoiatrica specifica.</span></>}
                {triageOd.livello==="giallo"&&<><b>Alcuni segnali da monitorare</b><span>Ti consigliamo una valutazione odontoiatrica di controllo.</span></>}
                {triageOd.livello==="rosso"&&<><b>Segnali significativi</b><span>Ti consigliamo una valutazione odontoiatrica specifica, in collaborazione con il percorso fisioterapico.</span></>}
              </div>
            </div>
            {triageOd.motivi.length>0&&<div className="repsec"><h3>Cosa abbiamo osservato</h3><ul>{triageOd.motivi.map((f,i)=><li key={i}>{explainFlag(f.etichetta,ODONTO_TRIAGE_SPIEGA)}</li>)}</ul></div>}
            <div className="savebar"><button className="btn ghost" onClick={()=>window.print()}>Stampa / Mostra al paziente</button></div>
          </div>}

          {tab==="confronto"&&<div>
            <h2>Confronto tra visite</h2>
            <p className="note" style={{marginTop:4,marginBottom:0}}>Mostra solo le voci che sono cambiate tra le due visite selezionate.</p>
            {visite.length<2?<p className="note">Servono almeno due visite per confrontare i dati. Aggiungine una dalla scheda Odontoiatra o Fisioterapista.</p>:<>
              <div className="comparebar">
                <label>Visita A<select value={cmpAId} onChange={e=>setCmpA(e.target.value)}>{visite.map((vi,i)=><option key={vi.id} value={vi.id}>Visita {i+1} ({vi.data?dfmt(vi.data):"senza data"})</option>)}</select></label>
                <label>Visita B<select value={cmpBId} onChange={e=>setCmpB(e.target.value)}>{visite.map((vi,i)=><option key={vi.id} value={vi.id}>Visita {i+1} ({vi.data?dfmt(vi.data):"senza data"})</option>)}</select></label>
              </div>
              {(()=>{
                const A=visite.find(x=>x.id===cmpAId)||{};const B=visite.find(x=>x.id===cmpBId)||{};
                const dO=diffFields(ODO,A.odontoiatra,B.odontoiatra);
                const dF=diffFields(FISIO,A.fisioterapista,B.fisioterapista);
                if(!dO.length&&!dF.length)return <p className="note">Nessuna differenza rilevata tra le due visite selezionate.</p>;
                return (<>
                  {dO.length>0&&<div className="repsec"><h3>Odontoiatra — differenze</h3><table className="diff"><thead><tr><th>Voce</th><th>Visita A</th><th>Visita B</th></tr></thead><tbody>{dO.map((r,i)=><tr key={i}><td>{r.label}</td><td className="old">{r.a}</td><td className="new">{r.b}</td></tr>)}</tbody></table></div>}
                  {dF.length>0&&<div className="repsec"><h3>Fisioterapista — differenze</h3><table className="diff"><thead><tr><th>Voce</th><th>Visita A</th><th>Visita B</th></tr></thead><tbody>{dF.map((r,i)=><tr key={i}><td>{r.label}</td><td className="old">{r.a}</td><td className="new">{r.b}</td></tr>)}</tbody></table></div>}
                </>);
              })()}
            </>}
          </div>}

          {tab==="semg"&&<div>
            <h2>Elettromiografia di superficie (sEMG)</h2>
            <p className="note" style={{marginTop:0}}>Inserire i valori pre e post trattamento per questa visita. VN = valori normali di riferimento.</p>
            <VisitBar />
            {val!==null&&<div className="visitmeta"><label>Data di questa visita <input type="date" value={activeVisit.data||""} onChange={e=>setVisitDate(e.target.value)} /></label>{visite.length>1&&<button className="notebtn" onClick={()=>deleteVisit(activeVisitId)}>Elimina questa visita</button>}</div>}
            {val===null?<p className="note">Caricamento…</p>:<SemgMatrix data={activeVisit.semg||{}} onSet={setSE} />}
            <div className="savebar"><button className="btn primary" onClick={save}>Salva valutazione</button><button className="btn ghost" onClick={()=>window.print()}>Stampa / PDF</button>{saved&&<span className="savemsg">{saved}</span>}</div>
            {visite.length>1&&<div className="repsec">
              <h3>Andamento sEMG su tutte le visite</h3>
              <p className="note" style={{marginTop:0}}>Confronto dei valori pre/post registrati in ciascuna visita.</p>
              <div style={{overflowX:"auto"}}>
              <table className="semg">
                <thead>
                  <tr><th>Indice</th><th>VN</th>{visite.map((vi,i)=><th key={vi.id} colSpan={2} style={{textAlign:"center"}}>Visita {i+1}<br/><small style={{fontWeight:400,textTransform:"none"}}>{vi.data?dfmt(vi.data):""}</small></th>)}</tr>
                  <tr><th></th><th></th>{visite.map(vi=><React.Fragment key={vi.id}><th>Pre</th><th>Post</th></React.Fragment>)}</tr>
                </thead>
                <tbody>
                  {SEMG.map(s=>(<tr key={s.n}><td>{s.l}</td><td className="vn">{s.vn}</td>
                    {visite.map(vi=>{const pre=vi.semg&&vi.semg.pre&&vi.semg.pre[s.n];const post=vi.semg&&vi.semg.post&&vi.semg.post[s.n];
                      return <React.Fragment key={vi.id}><td>{pre!=null&&pre!==""?pre:"—"}</td><td>{post!=null&&post!==""?post:"—"}</td></React.Fragment>;})}
                  </tr>))}
                </tbody>
              </table>
              </div>
            </div>}
          </div>}

          {tab==="esercizi"&&<div>
            <h2>Programma esercizi</h2>
            <p className="note" style={{marginTop:4}}>Crea il programma personalizzato per il paziente, pescando dalla libreria condivisa o aggiungendo esercizi su misura.</p>

            <div className="repsec" style={{borderTop:"none",paddingTop:0}}>
              <h3>Libreria esercizi (condivisa tra tutti i pazienti)</h3>
              <div className="diagspec-item">
                <div className="exerform">
                  <input placeholder="Nome esercizio" value={nuovoEs.nome} onChange={e=>setNuovoEs({...nuovoEs,nome:e.target.value})} />
                  <input placeholder="Emoji (facoltativa)" value={nuovoEs.icona} onChange={e=>setNuovoEs({...nuovoEs,icona:e.target.value})} style={{maxWidth:110}} />
                  <select value={nuovoEs.frequenza} onChange={e=>setNuovoEs({...nuovoEs,frequenza:e.target.value})}>{FREQUENZE_ESERCIZI.map(f=><option key={f} value={f}>{f}</option>)}</select>
                  <input placeholder="Serie × ripetizioni / durata (es. 2×10)" value={nuovoEs.dettaglio_frequenza} onChange={e=>setNuovoEs({...nuovoEs,dettaglio_frequenza:e.target.value})} />
                  <input placeholder="Recupero (es. 60″)" value={nuovoEs.recupero||""} onChange={e=>setNuovoEs({...nuovoEs,recupero:e.target.value})} style={{maxWidth:150}} />
                </div>
                <textarea placeholder="Descrizione / istruzioni…" value={nuovoEs.descrizione} onChange={e=>setNuovoEs({...nuovoEs,descrizione:e.target.value})} />
                <input placeholder="Link video (facoltativo)" value={nuovoEs.video} onChange={e=>setNuovoEs({...nuovoEs,video:e.target.value})} />
                <div className="savebar" style={{marginTop:10}}><button className="btn primary" onClick={aggiungiInLibreria}>{"+"} Salva in libreria</button></div>
              </div>
              {libreria===null?<p className="note">Caricamento libreria…</p>:libreria.length===0?<p className="note">Nessun esercizio in libreria. Aggiungine uno sopra.</p>:
                <div className="liblist">{libreria.map(es=>(<div className="libitem" key={es.id}>
                  <div><b>{es.icona?es.icona+" ":""}{es.nome}</b><small> · {es.frequenza}{es.dettaglio_frequenza?" · "+es.dettaglio_frequenza:""}</small></div>
                  <div style={{display:"flex",gap:8}}>
                    <button className="btn ghost" onClick={()=>assegnaAlPaziente(es)}>{"+"} Assegna</button>
                    <button className="notebtn" onClick={()=>rimuoviDallaLibreria(es.id)}>{"✕"}</button>
                  </div>
                </div>))}</div>}
            </div>

            <div className="repsec">
              <h3>Aggiungi esercizio su misura per questo paziente</h3>
              <p className="note" style={{marginTop:0}}>Non viene salvato in libreria, resta solo nel programma di questo paziente.</p>
              <div className="diagspec-item">
                <div className="exerform">
                  <input placeholder="Nome esercizio" value={nuovoEsPersonale.nome} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,nome:e.target.value})} />
                  <input placeholder="Emoji" value={nuovoEsPersonale.icona} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,icona:e.target.value})} style={{maxWidth:110}} />
                  <select value={nuovoEsPersonale.frequenza} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,frequenza:e.target.value})}>{FREQUENZE_ESERCIZI.map(f=><option key={f} value={f}>{f}</option>)}</select>
                  <input placeholder="Serie × ripetizioni / durata" value={nuovoEsPersonale.dettaglio_frequenza} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,dettaglio_frequenza:e.target.value})} />
                  <input placeholder="Recupero" value={nuovoEsPersonale.recupero||""} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,recupero:e.target.value})} style={{maxWidth:150}} />
                </div>
                <textarea placeholder="Descrizione / istruzioni…" value={nuovoEsPersonale.descrizione} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,descrizione:e.target.value})} />
                <input placeholder="Link video (facoltativo)" value={nuovoEsPersonale.video} onChange={e=>setNuovoEsPersonale({...nuovoEsPersonale,video:e.target.value})} />
                <div className="savebar" style={{marginTop:10}}><button className="btn primary" onClick={aggiungiPersonalizzatoAlPaziente}>{"+"} Aggiungi al programma</button></div>
              </div>
            </div>

            <div className="repsec">
              <h3>Programma assegnato a {p.nome}</h3>
              {(!v.programma_esercizi||v.programma_esercizi.length===0)?<p className="note">Nessun esercizio ancora assegnato.</p>:
                Object.entries((v.programma_esercizi||[]).reduce((acc,es)=>{(acc[es.frequenza||"Altro"]=acc[es.frequenza||"Altro"]||[]).push(es);return acc;},{})).map(([freq,list])=>(
                  <div key={freq} style={{marginBottom:16}}>
                    <div className="grp" style={{borderTop:"none",paddingTop:0}}>{freq}</div>
                    <div className="exercgrid">{list.map((es,i)=>(<div className="exercard" key={es.assignedId||i}>
                      <div className="exercard-head"><b>{es.icona?es.icona+" ":""}{es.nome}</b><span style={{display:"flex",gap:6}}><button className="notebtn" onClick={()=>setEditEsId(editEsId===es.assignedId?null:es.assignedId)}>{editEsId===es.assignedId?"Fatto":"✎ Modifica"}</button><button className="notebtn" onClick={()=>rimuoviDalPaziente(es.assignedId)}>{"✕"}</button></span></div>
                      {editEsId===es.assignedId?(<div className="exeredit">
                        <div className="exerform">
                          <input placeholder="Serie × ripetizioni / durata" value={es.dettaglio_frequenza||""} onChange={e=>modificaEsercizioPaziente(es.assignedId,"dettaglio_frequenza",e.target.value)} />
                          <input placeholder="Recupero" value={es.recupero||""} onChange={e=>modificaEsercizioPaziente(es.assignedId,"recupero",e.target.value)} style={{maxWidth:150}} />
                          <select value={es.frequenza||"Altro"} onChange={e=>modificaEsercizioPaziente(es.assignedId,"frequenza",e.target.value)}>{FREQUENZE_ESERCIZI.map(f=><option key={f} value={f}>{f}</option>)}</select>
                        </div>
                        <textarea placeholder="Descrizione / istruzioni…" value={es.descrizione||""} onChange={e=>modificaEsercizioPaziente(es.assignedId,"descrizione",e.target.value)} />
                        <input placeholder="Link video (facoltativo)" value={es.video||""} onChange={e=>modificaEsercizioPaziente(es.assignedId,"video",e.target.value)} />
                        <div className="h" style={{marginTop:6}}>Le modifiche valgono solo per questo paziente: l'esercizio in libreria non cambia. Ricorda di premere "Salva programma".</div>
                      </div>):(<div>
                      {(es.dettaglio_frequenza||es.recupero)&&<div className="exercard-meta">{[es.dettaglio_frequenza,es.recupero?"Recupero "+es.recupero:""].filter(Boolean).join(" · ")}</div>}
                      {es.descrizione&&<p>{es.descrizione}</p>}
                      {es.video&&<a href={es.video} target="_blank" rel="noreferrer">{"▶"} Guarda il video</a>}
                      </div>)}
                    </div>))}</div>
                  </div>
                ))}
              <div className="f wide" style={{marginTop:14}}><label>Indicazioni per il paziente (compaiono nel documento)</label><textarea placeholder="Es. Esegui gli esercizi con calma, senza dolore. Se compare fastidio, riduci l'ampiezza del movimento…" value={v.programma_indicazioni||""} onChange={e=>setVal(s=>({...s,programma_indicazioni:e.target.value}))} /></div>
              <div className="f" style={{marginTop:10}}><label>Programma a cura di</label><input value={v.programma_firma!=null?v.programma_firma:"Studio Dr. Sandro Iorio"} onChange={e=>setVal(s=>({...s,programma_firma:e.target.value}))} /></div>
              <div className="savebar"><button className="btn primary" onClick={save}>Salva programma</button><button className="btn ghost" onClick={anteprimaProgramma}>Anteprima / PDF per il paziente</button><button className="btn ghost" onClick={scaricaProgramma}>Scarica file</button>{saved&&<span className="savemsg">{saved}</span>}</div>
            </div>
          </div>}

          {tab==="ai"&&<div>
            <h2>Inquadramento assistito (IA)</h2>
            <div className="warnbox"><b>Supporto alla decisione clinica, non una diagnosi.</b> Le ipotesi vanno confermate dal clinico con l'esame e i test SSDC. In presenza di bandiere rosse, valutare l'invio a una valutazione medica.</div>
            {!ai&&<button className="btn primary" onClick={genAI} disabled={aiBusy}>{aiBusy?"Elaborazione in corso…":"Genera inquadramento del caso"}</button>}
            {aiErr&&<div className="err">{aiErr}<div style={{fontWeight:400,marginTop:6}}>Nota: la sintesi IA funziona nell'anteprima Claude. Per il sito pubblicato serve un piccolo proxy con la tua chiave Anthropic (vedi guida).</div></div>}
            {ai&&<div>
              <div className="repsec" style={{borderTop:"none",paddingTop:0,marginTop:4}}><h3>Sintesi del caso</h3><p style={{color:"var(--ink2)",margin:0}}>{ai.sintesi}</p></div>
              <div className="aicols">
                <div className="aibox"><h3>Inquadramento odontoiatrico <Src f="Odontoiatra" /></h3>
                  <b>Ipotesi di lavoro</b><ul>{(ai.odontoiatrico&&ai.odontoiatrico.ipotesi||[]).map((x,i)=><li key={i}>{x}</li>)}</ul>
                  <b>Da confermare</b><ul>{(ai.odontoiatrico&&ai.odontoiatrico.da_confermare||[]).map((x,i)=><li key={i}>{x}</li>)}</ul></div>
                <div className="aibox"><h3>Inquadramento fisioterapico <Src f="Fisioterapista" /></h3>
                  <b>Ipotesi di lavoro</b><ul>{(ai.fisioterapico&&ai.fisioterapico.ipotesi||[]).map((x,i)=><li key={i}>{x}</li>)}</ul>
                  <b>Da confermare</b><ul>{(ai.fisioterapico&&ai.fisioterapico.da_confermare||[]).map((x,i)=><li key={i}>{x}</li>)}</ul></div>
              </div>
              {ai.correlazioni&&ai.correlazioni.length>0&&<div className="repsec"><h3>Correlazioni <span className="pill">ipotesi</span></h3><ul className="ipotesi">{ai.correlazioni.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
              {ai.red_flags&&ai.red_flags.length>0&&<div className="repsec"><h3>Bandiere rosse da escludere</h3><div className="redbox"><ul>{ai.red_flags.map((x,i)=><li key={i}>{x}</li>)}</ul></div></div>}
              {ai.priorita&&ai.priorita.length>0&&<div className="repsec"><h3>Priorita di lavoro</h3><ol>{ai.priorita.map((x,i)=><li key={i}>{x}</li>)}</ol></div>}
              <div className="savebar"><button className="btn primary" onClick={saveAI}>Salva nel report</button><button className="btn ghost" onClick={()=>setAi(null)}>Rigenera</button><button className="btn ghost" onClick={()=>window.print()}>Stampa / PDF</button>{saved&&<span className="savemsg">{saved}</span>}</div>
            </div>}
          </div>}
        </div>
      </div>
    </div>
  );
}

/* ===== Documento "Programma di esercizi" per il paziente (grafica dello studio) ===== */
const FREQ_EMOJI={"Ogni giorno":"☀️","2 volte al giorno":"🔁","3 volte a settimana":"📅","1 volta al giorno":"🕐","Ogni 2/3 ore":"⏱️","Altro":"📋"};
function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function urlSicuro(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return (x.protocol==="http:"||x.protocol==="https:")?x.href:"";}catch(e){return "";}}
function nomeFileProgramma(p){const base=((p.cognome||"")+"-"+(p.nome||"")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return "Programma-esercizi-"+(base||"paziente")+".html";}
function buildProgrammaHTML(p,programma,opt){
  opt=opt||{};
  const lista=programma||[];
  const gruppi={};
  lista.forEach(es=>{const k=es.frequenza||"Altro";(gruppi[k]=gruppi[k]||[]).push(es);});
  const ordine=[...FREQUENZE_ESERCIZI.filter(f=>gruppi[f]),...Object.keys(gruppi).filter(f=>!FREQUENZE_ESERCIZI.includes(f))];
  const nomePaz=((p.cognome||"")+" "+(p.nome||"")).trim();
  const cardEs=es=>{
    const meta=[es.dettaglio_frequenza,es.recupero?("Recupero "+es.recupero):""].filter(Boolean).join(" · ");
    const link=urlSicuro(es.video);
    return `<div class="card"><h3>${es.icona?escH(es.icona)+" ":""}${escH(es.nome)}</h3>${meta?`<div class="meta">${escH(meta)}</div>`:""}${es.descrizione?`<p>${escH(es.descrizione)}</p>`:""}${link?`<a href="${escH(link)}" target="_blank" rel="noopener">▶ Guarda il video</a>`:""}</div>`;
  };
  const riepilogo=ordine.map(f=>`<div class="sumcard"><h3>${FREQ_EMOJI[f]||"📋"} ${escH(f)}</h3><p>${escH(gruppi[f].map(e=>e.nome).join(", "))}</p></div>`).join("");
  const sezioni=ordine.map(f=>`<section class="sec"><span class="tag">${gruppi[f].length} ${gruppi[f].length===1?"esercizio":"esercizi"}</span><h2>${FREQ_EMOJI[f]||"📋"} ${escH(f)}</h2><div class="grid">${gruppi[f].map(cardEs).join("")}</div></section>`).join("");
  const indic=(opt.indicazioni||"").trim();
  const firma=(opt.firma||"").trim();
  const oggi=new Date().toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  const css=`*{box-sizing:border-box}html{min-height:100%;background:#0e3f45 linear-gradient(165deg,#0c202c 0%,#10303c 55%,#0e3f45 100%) no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:"Cabin",system-ui,-apple-system,"Segoe UI",sans-serif;color:#d3e0e5;line-height:1.6;background:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3{font-family:"Syne","Cabin",system-ui,sans-serif;color:#fff;margin:0;font-weight:600;line-height:1.15}
#tb{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:#06222a;border-bottom:1px solid #1d4a52;font:600 14px system-ui,sans-serif}
#tb span{color:#fff;margin-right:auto}#tb small{color:#8fb4ba;font-weight:400;flex-basis:100%}
#tb button{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:#12b5a5;color:#00323a;cursor:pointer}
.page{max-width:920px;margin:0 auto;padding:44px 28px 56px}
.cover{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.cover>div:first-child{flex:1 1 300px}.cover h1{font-size:clamp(30px,6vw,46px);max-width:420px}
.logo{width:260px;max-width:100%;flex:0 0 auto;border-radius:6px;display:block}
.pt{display:inline-block;margin-top:16px;padding:4px 12px;border:1px solid #1fb8a6;color:#57d3c4;border-radius:4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.intro{margin:26px 0 14px;font-size:16px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.badges span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:3px}
.b1{background:#064e46;color:#cdf3ec}.b2{border:1px solid #1fb8a6;color:#57d3c4}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sumcard{background:#324a58;border-radius:6px;padding:16px 18px;break-inside:avoid}.sumcard h3{font-size:19px;margin-bottom:6px}.sumcard p{margin:0;font-size:15px}
.note{margin-top:22px;background:#0a6b62;border-radius:6px;padding:16px 20px;break-inside:avoid}.note b{color:#fff}.note p{margin:6px 0 0;white-space:pre-line;color:#fff}
.sec{margin-top:44px}
.tag{display:table;break-after:avoid;page-break-after:avoid;background:#064e46;color:#bfeee5;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:3px;margin-bottom:12px}
.sec h2{font-size:clamp(24px,4.5vw,34px);margin-bottom:16px;break-after:avoid;page-break-after:avoid}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:rgba(15,36,48,.7);border:1px solid #3e5866;border-left:5px solid #0f9d8a;border-radius:4px;padding:16px 18px;break-inside:avoid}
.card h3{font-size:19px}.meta{font-weight:700;color:#fff;margin:6px 0;font-size:15px}
.card p{margin:8px 0;font-size:15px;white-space:pre-line}
.card a{color:#2cc3b1;font-weight:700;text-decoration:underline}
.remember,.sign{margin-top:14px;background:#0a6b62;border-radius:6px;padding:16px 20px;break-inside:avoid;color:#fff}
.remember{margin-top:44px}.sign b{display:block}
.wrap{width:100%;border-collapse:collapse}.wrap td{padding:0}.sp{height:0}
@page{size:A4;margin:0}
@media print{#tb{display:none!important}.sp{height:12mm}.page{padding:0 14mm}}`;
  const toolbar=opt.toolbar?`<div id="tb"><span>Anteprima per il paziente</span><button onclick="window.print()">🖨 Stampa / Salva come PDF</button><button onclick="dl()">⬇ Scarica file</button><small>Per il PDF: nella finestra di stampa scegli “Salva come PDF” come destinazione.</small></div><script id="tbs">function dl(){var c=document.documentElement.cloneNode(true);var t=c.querySelector("#tb");if(t)t.remove();var s=c.querySelector("#tbs");if(s)s.remove();var b=new Blob(["<!DOCTYPE html>\\n"+c.outerHTML],{type:"text/html;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=${JSON.stringify(nomeFileProgramma(p))};document.body.appendChild(a);a.click();a.remove();}<\/script>`:"";
  return `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programma di esercizi${nomePaz?" – "+escH(nomePaz):""}</title><link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body>${toolbar}<table class="wrap"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td><div class="page"><header><div class="cover"><div><h1>Programma di<br>Esercizi<br>Personalizzato</h1>${nomePaz?`<div class="pt">${escH(nomePaz)}</div>`:""}</div><img class="logo" src="${LOGO_SRC}" alt="Dr. Sandro Iorio"></div><p class="intro">Questo programma è stato costruito su misura per te: ${lista.length} ${lista.length===1?"esercizio organizzato":"esercizi organizzati"} per frequenza. Segui le indicazioni e utilizza i link video per eseguire ogni esercizio nella forma corretta.</p><div class="badges"><span class="b1">Personalizzato</span><span class="b2">${escH(oggi)}</span></div><div class="sumgrid">${riepilogo}</div>${indic?`<div class="note"><b>📝 Indicazioni per te</b><p>${escH(indic)}</p></div>`:""}</header>${sezioni}<div class="remember"><b>💡 Ricorda:</b> la costanza è la chiave del miglioramento. Esegui gli esercizi con le frequenze indicate. In caso di difficoltà, contatta il tuo professionista di riferimento.</div>${firma?`<div class="sign">Programma a cura di<b>${escH(firma)}</b></div>`:""}</div></td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table></body></html>`;
}

function NuovoPaziente({token,onClose,onCreated}){
  const [anag,setAnag]=useState({nome:"",cognome:"",data_nascita:"",sesso:"",email:"",telefono:"",percorso:""});
  const [answers,setAnswers]=useState({});
  const [busy,setBusy]=useState(false);const [err,setErr]=useState("");
  const setA=(k,x)=>setAnag(s=>({...s,[k]:x}));
  const setAns=(k,x)=>setAnswers(s=>({...s,[k]:x}));
  async function crea(){
    setErr("");
    if(!anag.cognome.trim()||!anag.nome.trim()){setErr("Cognome e nome sono obbligatori.");return;}
    if(!anag.percorso){setErr("Scegli il percorso.");return;}
    setBusy(true);
    try{
      const row={nome:anag.nome.trim(),cognome:anag.cognome.trim(),data_nascita:anag.data_nascita||null,sesso:anag.sesso||null,email:anag.email.trim()||null,telefono:anag.telefono.trim()||null,percorso:anag.percorso,answers:{...answers,percorso:anag.percorso}};
      const created=(SUPABASE_URL&&token)?await createPatientRemote(row,token):createPatientLocal(row);
      onCreated(created);
    }catch(e){setErr(String(e.message||e));setBusy(false);}
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="head"><div className="sp"><h1 style={{margin:".25em 0 0"}}>Nuovo paziente</h1><div className="kv"><span>Inserisci i dati e compila l'anamnesi insieme al paziente</span></div></div><button className="close" onClick={onClose}>{"×"}</button></div>
        <div className="card">
          <h2 style={{marginTop:0}}>Anagrafica</h2>
          <div className="form">
            <div className="f"><label>Cognome *</label><input value={anag.cognome} onChange={e=>setA("cognome",e.target.value)} /></div>
            <div className="f"><label>Nome *</label><input value={anag.nome} onChange={e=>setA("nome",e.target.value)} /></div>
            <div className="f"><label>Data di nascita</label><input type="date" value={anag.data_nascita} onChange={e=>setA("data_nascita",e.target.value)} /></div>
            <div className="f"><label>Sesso</label><div className="optrow">{[["m","M"],["f","F"]].map(([k,l])=><button key={k} className={"optbtn"+(anag.sesso===k?" on":"")} onClick={()=>setA("sesso",anag.sesso===k?"":k)}>{l}</button>)}</div></div>
            <div className="f"><label>Telefono</label><input type="tel" value={anag.telefono} onChange={e=>setA("telefono",e.target.value)} /></div>
            <div className="f"><label>Email</label><input type="email" value={anag.email} onChange={e=>setA("email",e.target.value)} /></div>
            <div className="f wide"><label>Percorso *</label><div className="optrow">{Object.entries(PERCORSI).map(([k,l])=><button key={k} className={"optbtn"+(anag.percorso===k?" on":"")} onClick={()=>setA("percorso",k)}>{l}</button>)}</div></div>
          </div>
          <h2 style={{marginTop:26}}>Anamnesi</h2>
          <p className="note" style={{marginTop:0}}>Tutte le risposte si possono modificare in seguito dalla scheda del paziente (dove potrai anche allegare i documenti degli specialisti).</p>
          <ClinForm fields={ANAMNESI} data={answers} onSet={setAns} />
          {err&&<div className="err" style={{marginTop:14}}>{err}</div>}
          <div className="savebar"><button className="btn primary" disabled={busy} onClick={crea}>{busy?"Creazione…":"Crea paziente"}</button><button className="btn ghost" onClick={onClose}>Annulla</button></div>
        </div>
      </div>
    </div>
  );
}

function Dashboard({patients,demo,token,onLogout,onRefresh,onConfig,onPatientDeleted,onAnswersUpdated,onPatientCreated}){
  const [showNew,setShowNew]=useState(false);
  const [q,setQ]=useState("");const [perc,setPerc]=useState("tutti");const [onlyRed,setOnlyRed]=useState(false);const [sel,setSel]=useState(null);
  const enriched=useMemo(()=>patients.map(p=>{const fl=computeFlags(p.answers);return{...p,_red:fl.filter(f=>f.livello==="rosso").length,_yel:fl.filter(f=>f.livello==="giallo").length};}),[patients]);
  const list=useMemo(()=>enriched.filter(p=>{if(perc!=="tutti"&&p.percorso!==perc)return false;if(onlyRed&&!p._red)return false;if(q){const s=((p.nome||"")+" "+(p.cognome||"")).toLowerCase();if(!s.includes(q.toLowerCase()))return false;}return true;}),[enriched,q,perc,onlyRed]);
  const stats={tot:patients.length,red:enriched.filter(p=>p._red).length,dcm:patients.filter(p=>p.percorso==="dcm").length,junior:patients.filter(p=>p.percorso==="junior").length};
  return (<div className="wrap">
    <div className="topbar"><img className="logo" src={LOGO_SRC} alt="Dr. Sandro Iorio"/><div className="ttl">Gestionale clinico<small>Pazienti schedati · SSDC</small></div><div className="sp"></div>
      {demo&&<span className="demo-pill">Demo</span>}{demo&&onConfig&&<button className="chip" onClick={onConfig}>{"⚙"} Configura</button>}{demo&&onRefresh&&<button className="chip" onClick={onRefresh}>{"↻"} Aggiorna</button>}
      <button className="chip on" onClick={()=>setShowNew(true)}>{"+"} Nuovo paziente</button>
      <button className="chip" onClick={onLogout}>{demo?"Esci":"Logout"}</button></div>
    <div className="stats">
      <div className="stat"><div className="n">{stats.tot}</div><div className="l">Pazienti totali</div></div>
      <div className="stat red"><div className="n">{stats.red}</div><div className="l">Con bandiere rosse</div></div>
      <div className="stat"><div className="n">{stats.dcm}</div><div className="l">Percorso DCM</div></div>
      <div className="stat"><div className="n">{stats.junior}</div><div className="l">Percorso Junior</div></div></div>
    <div className="toolbar"><div className="search"><span className="mag">{"🔍"}</span><input placeholder="Cerca per nome o cognome…" value={q} onChange={e=>setQ(e.target.value)} /></div>
      {["tutti","junior","aligner","dcm","atleta"].map(k=>(<button key={k} className={"chip"+(perc===k?" on":"")} onClick={()=>setPerc(k)}>{k==="tutti"?"Tutti":PERCORSI[k]}</button>))}
      <button className={"chip"+(onlyRed?" on":"")} onClick={()=>setOnlyRed(v=>!v)}>{"⚠️"} Solo bandiere rosse</button></div>
    <div className="plist">{list.length===0&&<div className="empty">Nessun paziente trovato.</div>}
      {list.map(p=>(<div className="prow" key={p.id} onClick={()=>setSel(p)}><div>
        <div className="nm">{p.cognome} {p.nome}</div>
        <div className="sub"><span className={"badge "+p.percorso}>{PERCORSI[p.percorso]}</span><span>{ageFrom(p.data_nascita)??"–"} anni</span><span>·</span><span>{dfmt(p.created_at)}</span></div></div>
        <div className="right">{p._red>0&&<span className="redtag">{"⚠️"} {p._red}</span>}<span className="dots">{p._red>0&&<span className="dot rosso"></span>}{p._yel>0&&<span className="dot giallo"></span>}{p._red===0&&p._yel===0&&<span className="dot verde"></span>}</span><span className="chev">{"›"}</span></div></div>))}</div>
    {showNew&&<NuovoPaziente token={token} onClose={()=>setShowNew(false)} onCreated={p=>{if(onPatientCreated)onPatientCreated(p);setShowNew(false);setSel(p);}} />}
    {sel&&<PatientSheet p={sel} token={token} onClose={()=>setSel(null)} onDeleted={onPatientDeleted} onAnswersUpdated={onAnswersUpdated} />}
  </div>);
}

function Setup({onClose}){
  const [url,setUrl]=useState(_cfg.url||"");const [key,setKey]=useState(_cfg.key||"");const [ai,setAi]=useState(_cfg.ai||"");const [copied,setCopied]=useState(false);
  function save(){localStorage.setItem("ssdc_cfg",JSON.stringify({url:url.trim(),key:key.trim(),ai:ai.trim()}));location.reload();}
  const base=location.origin+location.pathname.replace(/gestionale\.html$/,"anamnesi.html");
  const plink=url&&key?`${base}?u=${encodeURIComponent(url.trim())}&k=${encodeURIComponent(key.trim())}&percorso=dcm`:"";
  function copy(){if(plink){navigator.clipboard&&navigator.clipboard.writeText(plink);setCopied(true);setTimeout(()=>setCopied(false),2000);}}
  return (<div className="wrap"><div className="topbar"><img className="logo" src={LOGO_SRC} alt="Dr. Sandro Iorio"/><div className="ttl">Gestionale clinico<small>Configurazione</small></div></div>
    <div className="login card"><h1>Configura lo studio</h1>
      <p className="note" style={{marginTop:0}}>Incolla i due valori che trovi su Supabase (Settings &rarr; API). Si salvano su questo dispositivo: non devi modificare alcun file.</p>
      <label className="cfgl">Project URL</label>
      <input placeholder="https://xxxx.supabase.co" value={url} onChange={e=>setUrl(e.target.value)} />
      <label className="cfgl">anon public key</label>
      <input placeholder="eyJhbGci..." value={key} onChange={e=>setKey(e.target.value)} />
      <label className="cfgl">URL proxy IA (facoltativo)</label>
      <input placeholder="https://.../.netlify/functions/ai" value={ai} onChange={e=>setAi(e.target.value)} />
      {plink&&<div className="plink"><div className="cfgl">Link da inviare ai pazienti (cambia <b>percorso</b>: junior/aligner/dcm/atleta)</div>
        <div className="plinkbox">{plink}</div><button className="btn ghost" onClick={copy}>{copied?"Copiato!":"Copia link paziente"}</button></div>}
      <button className="btn primary" onClick={save}>Salva e avvia</button>
      <button className="btn ghost" style={{marginTop:8}} onClick={onClose}>Annulla</button>
    </div></div>);
}

function App(){
  const demo=!SUPABASE_URL;
  const [setup,setSetup]=useState(false);
  const [token,setToken]=useState(null);
  const [patients,setPatients]=useState(demo?demoData():[]);
  const [email,setEmail]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  useEffect(()=>{if(!demo)return;const h=()=>setPatients(demoData());window.addEventListener("focus",h);return()=>window.removeEventListener("focus",h);},[demo]);
  async function doLogin(){setErr("");setBusy(true);try{const t=await login(email,pw);setToken(t);const data=await fetchPatients(t);setPatients(data);}catch(e){setErr(String(e.message||e));}finally{setBusy(false);}}
  function handlePatientDeleted(id){setPatients(ps=>ps.filter(p=>p.id!==id));}
  function handlePatientCreated(p){setPatients(ps=>[p,...ps]);}
  function handleAnswersUpdated(id,newAnswers){setPatients(ps=>ps.map(p=>p.id===id?{...p,answers:newAnswers}:p));}
  if(setup) return <Setup onClose={()=>setSetup(false)} />;
  if(demo) return <Dashboard patients={patients} demo token={null} onConfig={()=>setSetup(true)} onRefresh={()=>setPatients(demoData())} onLogout={()=>location.reload()} onPatientDeleted={handlePatientDeleted} onAnswersUpdated={handleAnswersUpdated} onPatientCreated={handlePatientCreated} />;
  if(!token) return (<div className="wrap"><div className="topbar"><img className="logo" src={LOGO_SRC} alt="Dr. Sandro Iorio"/><div className="ttl">Gestionale clinico<small>Accesso riservato</small></div></div>
    <div className="login card"><h1>Accedi</h1><p className="note">Riservato al personale dello studio.</p>
      <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} />
      <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} />
      {err&&<div className="err">{err}</div>}
      <button className="btn primary" disabled={busy} onClick={doLogin}>{busy?"Accesso…":"Entra"}</button>
      <button className="btn ghost" style={{width:"100%",marginTop:8}} onClick={()=>setSetup(true)}>Configura</button>
      <p className="note">L'utente deve esistere in <b>Auth</b> e avere una riga nella tabella <b>staff</b>.</p></div></div>);
  return <Dashboard patients={patients} demo={false} token={token} onLogout={()=>{setToken(null);setPatients([]);}} onPatientDeleted={handlePatientDeleted} onAnswersUpdated={handleAnswersUpdated} onPatientCreated={handlePatientCreated} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
