<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestionale clinico · Studio Dr. Sandro Iorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#003a43;--track:#0a4d56;--surface:#fff;--ink:#0b2d2f;--ink2:#476664;--ink3:#86a4a1;
    --cyan:#00b6ad;--cyan-d:#008f88;--cyan-l:#36d4cb;--on-dark:#d8f1ee;--on-dark2:#74aaa6;
    --line:#d6e6e3;--line2:#c1d7d3;--verde:#2f9e63;--giallo:#c2871a;--rosso:#d2553f;
    --shadow:0 1px 2px rgba(0,20,22,.18),0 18px 40px -16px rgba(0,20,22,.4);--shadow-sm:0 1px 2px rgba(0,42,48,.12);}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);font-size:16px;
    background:radial-gradient(90% 55% at 85% -8%,#015b66 0,transparent 60%),radial-gradient(80% 60% at -8% 108%,#00646f 0,transparent 55%),linear-gradient(180deg,#00424c,#002e35);
    background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0);background-size:22px 22px}
  .wrap{max-width:1080px;margin:0 auto;padding:8px 18px 60px;position:relative;z-index:1}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 2px}
  .topbar .logo{height:48px;border-radius:8px;box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
  .topbar .ttl{color:var(--on-dark);font-weight:700}.topbar .ttl small{display:block;color:var(--on-dark2);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .topbar .sp{flex:1}.demo-pill{background:rgba(0,182,173,.16);border:1px solid rgba(0,182,173,.5);color:var(--cyan-l);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:99px}
  .card{background:linear-gradient(180deg,#fff,#f7fbfa);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:1.7rem;letter-spacing:-.02em;margin:.1em 0 .3em}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.35rem;letter-spacing:-.01em;margin:0}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 16px}
  @media(min-width:680px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:15px 16px}
  .stat .n{font-family:"Fraunces",serif;font-size:1.9rem;font-weight:600;color:#fff;line-height:1}.stat .l{color:var(--on-dark2);font-size:.8rem;font-weight:600;margin-top:5px}.stat.red .n{color:#ff9d86}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;position:relative}.search input{width:100%;font:inherit;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:11px 13px 11px 38px;outline:none}
  .search input::placeholder{color:var(--on-dark2)}.search input:focus{border-color:var(--cyan)}.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--on-dark2)}
  .chip{font:inherit;font-weight:600;font-size:.88rem;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--on-dark);border-radius:99px;padding:9px 14px;cursor:pointer;transition:.14s}
  .chip:hover{border-color:var(--cyan)}.chip.on{background:var(--cyan);color:#00343c;border-color:var(--cyan)}
  .plist{display:flex;flex-direction:column;gap:10px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;cursor:pointer;transition:.14s}
  .prow:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--cyan)}
  .prow .nm{font-weight:700;font-size:1.06rem}.prow .sub{color:var(--ink3);font-size:.85rem;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid}
  .badge.junior{background:#eaf6ee;color:#2c7d4e;border-color:#bfe3cd}.badge.aligner{background:#e6f3fb;color:#2b6f97;border-color:#bcdcef}
  .badge.dcm{background:#fbeee8;color:#b1543a;border-color:#e6c2b3}.badge.atleta{background:#f3eefb;color:#6b4b97;border-color:#d6c6ef}
  .right{display:flex;align-items:center;gap:14px}.dots{display:flex;gap:4px}.dots .dot{width:9px;height:9px;border-radius:50%}
  .dot.verde{background:var(--verde)}.dot.giallo{background:var(--giallo)}.dot.rosso{background:var(--rosso)}
  .redtag{display:inline-flex;align-items:center;gap:5px;background:#fbece8;border:1px solid #e3a99c;color:#a23823;font-size:.76rem;font-weight:700;padding:4px 9px;border-radius:99px}
  .chev{color:var(--ink3);font-size:1.3rem}.empty{color:var(--on-dark2);text-align:center;padding:40px}
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(0,30,34,.72);backdrop-filter:blur(4px);overflow-y:auto;padding:18px}
  .sheet{max-width:880px;margin:14px auto;animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .sheet .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}.sheet .head .sp{flex:1}
  .close{background:#fff;border:1px solid var(--line);border-radius:11px;width:40px;height:40px;cursor:pointer;font-size:1.2rem;color:var(--ink2)}
  .kv{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:.9rem;margin-top:6px}.kv b{color:var(--ink)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:9px 13px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;color:var(--ink2);font-size:.9rem;display:inline-flex;align-items:center;gap:7px}
  .tab.on{background:var(--cyan);color:#00343c;border-color:var(--cyan)}
  .tab .tg{width:8px;height:8px;border-radius:50%;background:var(--verde)}
  .sem{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}@media(min-width:560px){.sem{grid-template-columns:repeat(4,1fr)}}
  .dom{border:1.5px solid var(--line2);border-radius:14px;padding:12px 13px;background:#fff}.dom .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}
  .dom b{font-size:.96rem;display:block;margin-bottom:2px}.dom small{color:var(--ink2);font-size:.78rem;line-height:1.35}
  .repsec{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.repsec h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;margin:0 0 8px}
  .repsec ul,.repsec ol{margin:0;padding-left:20px;color:var(--ink2)}.repsec li{margin:4px 0}
  .redbox{background:#fbece8;border:1px solid #e3a99c;border-radius:13px;padding:12px 15px}.redbox li{color:#79271b}
  .ipotesi{font-style:italic}.pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#e4f6f4;color:var(--cyan-d);border:1px solid #c5e7e2;vertical-align:middle}
  .exam{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:11px;padding:9px 12px;font-size:.9rem;margin-top:8px}
  .exam .fi{width:30px;height:30px;border-radius:8px;background:#e4f6f4;color:var(--cyan-d);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
  .btn{font:inherit;font-weight:700;border:none;border-radius:12px;padding:11px 18px;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--cyan);color:#00343c}.btn.primary:hover{background:var(--cyan-l)}.btn.ghost{background:#fff;border:1.5px solid var(--line2);color:var(--ink2)}.btn.ghost:hover{border-color:var(--cyan)}
  .btn.danger{background:#fbece8;border:1.5px solid #e3a99c;color:#a23823}.btn.danger:hover{background:#f6d9d0}
  .visittabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .vtab{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;font-weight:700;color:var(--ink2);font-size:.85rem;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
  .vtab small{color:var(--ink3);font-weight:600;font-size:.72rem}
  .vtab.on{background:var(--cyan);color:#00343c;border-color:var(--cyan)}.vtab.on small{color:#00343c}
  .vtab.new{border-style:dashed;color:var(--cyan-d)}
  .visitmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .visitmeta label{font-size:.86rem;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
  .visitmeta input[type=date]{font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:6px 9px}
  .comparebar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .comparebar label{font-size:.86rem;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
  .comparebar select{font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px}
  table.diff{width:100%;border-collapse:collapse;margin-top:6px;font-size:.9rem}
  table.diff th{text-align:left;color:var(--ink3);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1.5px solid var(--line)}
  table.diff td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.diff td.old{color:#a23823;text-decoration:line-through;opacity:.75}
  table.diff td.new{color:#1a7a4c;font-weight:700}
  .trafficbig{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:16px;margin:14px 0;border:1.5px solid var(--line2)}
  .trafficbig .tbdot{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
  .trafficbig.verde{background:#eaf6ee;border-color:#bfe3cd}.trafficbig.verde .tbdot{background:var(--verde)}
  .trafficbig.giallo{background:#fbf3e0;border-color:#e6cf95}.trafficbig.giallo .tbdot{background:var(--giallo)}
  .trafficbig.rosso{background:#fbece8;border-color:#e3a99c}.trafficbig.rosso .tbdot{background:var(--rosso)}
  .trafficbig .tbtext{display:flex;flex-direction:column;gap:4px}
  .trafficbig .tbtext b{font-family:"Fraunces",serif;font-weight:600;font-size:1.15rem;color:var(--ink)}
  .trafficbig .tbtext span{color:var(--ink2);font-size:.94rem}
  .diagspec{display:flex;flex-direction:column;gap:12px;margin:10px 0 16px}
  .diagspec-item{border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff}
  .diagspec-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .diagspec-row input{flex:1;font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none}
  .diagspec-row input:focus{border-color:var(--cyan)}
  .diagspec-item textarea{width:100%;font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;min-height:60px;outline:none}
  .diagspec-item textarea:focus{border-color:var(--cyan)}
  .docupload{margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .doclist{display:flex;flex-direction:column;gap:6px}
  .exerform{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .exerform input,.exerform select{font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none}
  .exerform input:first-child{flex:2;min-width:160px}
  .diagspec-item>input{font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%;margin-top:8px;outline:none}
  .liblist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .libitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:12px;padding:10px 14px;background:#fff;flex-wrap:wrap}
  .libitem small{color:var(--ink3)}
  .exercgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
  @media(min-width:680px){.exercgrid{grid-template-columns:1fr 1fr}}
  .exercard{border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px;background:#fff}
  .exercard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .exercard-head b{font-family:"Fraunces",serif;font-size:1rem}
  .exercard-meta{color:var(--cyan-d);font-weight:700;font-size:.82rem;margin:4px 0}
  .exercard p{color:var(--ink2);font-size:.9rem;margin:6px 0}
  .exercard a{color:var(--cyan-d);font-weight:700;font-size:.86rem;text-decoration:none}
  .exercard a:hover{text-decoration:underline}
  .exeredit textarea,.exeredit>input{width:100%;font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;margin-top:8px;outline:none}
  .exeredit textarea{min-height:90px;resize:vertical}
  /* form clinico */
  .form{display:grid;grid-template-columns:1fr;gap:16px;margin-top:4px}@media(min-width:640px){.form{grid-template-columns:1fr 1fr}}
  .f label{font-weight:600;font-size:.95rem;display:block;margin-bottom:6px}
  .f input,.f textarea{width:100%;font:inherit;background:#fff;border:1.5px solid var(--line2);border-radius:11px;padding:10px 12px;outline:none}
  .f textarea{min-height:70px;resize:vertical}.f input:focus,.f textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,182,173,.14)}
  .f.wide{grid-column:1/-1}.f .h{color:var(--ink3);font-size:.8rem;margin-top:5px}
  .num{display:flex;align-items:center;gap:8px}.num .u{color:var(--ink3);font-size:.85rem;font-weight:600}
  .optrow{display:flex;flex-wrap:wrap;gap:6px}
  .optbtn{padding:7px 11px;border:1.5px solid var(--line2);border-radius:9px;background:#fff;cursor:pointer;font-size:.86rem;color:var(--ink2);transition:.12s}
  .optbtn:hover{border-color:var(--cyan)}.optbtn.on{background:#e4f6f4;border-color:var(--cyan);color:var(--cyan-d);font-weight:700}
  .grp{grid-column:1/-1;font-family:"Fraunces",serif;font-weight:600;font-size:1.02rem;color:var(--ink);border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
  table.semg{width:100%;border-collapse:collapse;margin-top:6px;font-size:.9rem}
  table.semg th{text-align:left;color:var(--ink3);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1.5px solid var(--line)}
  table.semg td{padding:6px 8px;border-bottom:1px solid var(--line)}
  table.semg td.vn{color:var(--ink3);font-size:.82rem;white-space:nowrap}
  table.semg input{width:80px;font:inherit;border:1.5px solid var(--line2);border-radius:9px;padding:7px 9px;outline:none}
  table.semg input:focus{border-color:var(--cyan)}
  .savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.4),#fff 45%);padding:14px 0 2px;display:flex;gap:12px;align-items:center;margin-top:18px}
  .savemsg{color:var(--cyan-d);font-weight:700;font-size:.9rem}
  .login{max-width:400px;margin:8vh auto 0}.login input{width:100%;font:inherit;background:#fff;border:1.5px solid var(--line2);border-radius:12px;padding:13px 14px;outline:none;margin-top:10px}
  .login input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,182,173,.16)}.login .btn{width:100%;margin-top:14px;padding:13px}
  .note{color:var(--ink3);font-size:.84rem;margin-top:12px}.err{color:#9c2f20;font-size:.9rem;margin-top:12px;font-weight:600;background:#fbece8;border:1px solid #e7b7aa;border-radius:11px;padding:10px 13px}
  .srcs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:2px;vertical-align:middle}
  .src{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid;background:#fff;line-height:1.3}
  .fnote{margin-top:9px}
  .notebtn{background:none;border:none;color:var(--cyan-d);font-weight:600;font-size:.8rem;cursor:pointer;padding:0}
  .notebtn:hover{text-decoration:underline}
  .noteinput{width:100%;font:inherit;font-size:.88rem;border:1.5px dashed var(--line2);border-radius:9px;padding:8px 10px;background:#f7fbfa;outline:none}
  .noteinput:focus{border-color:var(--cyan);border-style:solid;box-shadow:0 0 0 3px rgba(0,182,173,.12)}
  .warnbox{background:linear-gradient(180deg,#fbf3e0,#f8eccd);border:1px solid #e6cf95;border-radius:12px;padding:12px 14px;color:#6d521f;font-size:.9rem;margin:6px 0 16px}
  .aicols{display:grid;grid-template-columns:1fr;gap:18px;margin-top:8px}
  @media(min-width:680px){.aicols{grid-template-columns:1fr 1fr}}
  .aibox{border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px;background:#fff}
  .aibox h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.08rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .aibox b{display:block;margin:12px 0 4px;font-size:.82rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  .aibox ul{margin:0;padding-left:18px;color:var(--ink2)}.aibox li{margin:3px 0}
  .cfgl{display:block;font-weight:700;font-size:.82rem;color:var(--ink2);margin:14px 0 0}
  .plink{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .plinkbox{font-family:ui-monospace,monospace;font-size:.78rem;background:#f4faf9;border:1.5px dashed var(--line2);border-radius:10px;padding:10px 12px;word-break:break-all;color:var(--ink2);margin:6px 0 10px}
  @media print{.topbar,.toolbar,.stats,.close,.btn,.tabs,.savebar,.notebtn{display:none}.overlay{position:static;background:none;backdrop-filter:none;padding:0}body:before{display:none}body{background:#fff}}
</style>

<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

const has=(a,k,v)=>Array.isArray(a[k])&&a[k].includes(v);
function computeFlags(a){const f=[];const add=(d,l,e,det)=>f.push({dominio:d,livello:l,etichetta:e,dettaglio:det||"",fonte:"Anamnesi"});
  if(["bocca","misto"].includes(a.respiro_giorno))add("Respirazione","giallo","Respiro orale prevalente","Confermare la pervieta nasale (Glatzel).");
  if(has(a,"sonno_segni","apnee")||(has(a,"sonno_segni","russamento")&&["raramente","mai"].includes(a.risveglio)))add("Sonno","rosso","Sospetta apnea notturna (OSAS)","Suggerita valutazione medica del sonno.");
  if(a.bruxismo==="si")add("Bruxismo","giallo","Bruxismo / serramento riferito",a.bruxismo_mattino==="si"?"Con sintomi mattutini.":"");
  if(["dx","sx"].includes(a.masticazione))add("Occlusione","giallo","Masticazione monolaterale","Verificare con sEMG (POC MM).");
  if(a.deglutizione_atipica==="si")add("Occlusione","giallo","Sospetta spinta linguale","Valutare frenulo e funzione linguale.");
  if((has(a,"sintomi","dolore_atm")||has(a,"sintomi","rumori_articolari"))&&has(a,"sintomi","limitazione_apertura"))add("ATM","rosso","Disfunzione ATM da approfondire","Dolore/click + limitazione apertura.");
  if(has(a,"sintomi","cefalea_cervicalgia"))add("Cervicale","giallo","Cefalea/cervicalgia riferita","Valutare CFRT.");
  if(a.trauma==="si")add("Trauma","rosso","Trauma cranio-cervicale pregresso",a.trauma_dettaglio||"");
  if(a.trauma==="si"&&a.trauma_incoscienza==="si")add("Trauma","rosso","Trauma con perdita di coscienza","Valutazione medica prima del trattamento.");
  if(Number(a.nrs)>=7&&["oltre_6_mesi","anni"].includes(a.dolore_durata))add("Dolore","rosso","Dolore cronico intenso (NRS>=7, >6 mesi)","");
  if(has(a,"sintomi","vertigini")&&has(a,"sintomi","cefalea_cervicalgia")&&(a.trauma==="si"||Number(a.nrs)>=7))add("Neuro","rosso","Cluster vertigini + cefalea","Inviare a valutazione medica.");
  if(a.percorso==="junior"&&a.abitudini&&a.abitudini.some(x=>x!=="nessuna"))add("Funzionale","giallo","Abitudini viziate attive","Intercettazione funzionale precoce.");
  if(["dx","sx"].includes(a.masticazione)&&has(a,"sintomi","cefalea_cervicalgia"))add("Postura","giallo","Possibile compenso posturale","Valutare catena discendente.");
  return f;}
function correlazioni(a){const c=[];
  if(["bocca","misto"].includes(a.respiro_giorno)&&["dx","sx"].includes(a.masticazione))c.push("Respiro orale + masticazione monolaterale -> possibile compenso discendente (capo/spalla).");
  if(a.bruxismo==="si"&&has(a,"sintomi","cefalea_cervicalgia"))c.push("Bruxismo + cefalea/cervicalgia -> possibile sovraccarico masseteri/temporali.");
  if(a.deglutizione_atipica==="si")c.push("Spinta linguale -> possibile instabilita trasversale / recidiva.");
  if(a.trauma==="si"&&has(a,"sintomi","vertigini"))c.push("Trauma + vertigini -> valutare cervicale alta (CFRT) e sfera vestibolare.");

/* ===== Diagnosi di specialisti gia consultati -> segnali sui domini del quadro =====
   Fa "parlare" le diagnosi registrate (anamnesi + visite) con i semafori: una diagnosi
   ortopedica pregressa, ad esempio, pesa sul dominio Postura insieme agli altri segnali. */
const SPECIALISTA_DOMINIO_MAP=[
  [/ortoped/i,"Postura"],
  [/reumatolog/i,"Postura"],
  [/osteopat/i,"Postura"],
  [/neurolog/i,"Cervicale"],
  [/otorino|\borl\b/i,"Respirazione"],
  [/pneumolog|sonno/i,"Respirazione"],
  [/logoped/i,"Occlusione"],
  [/maxillo.?facciale|chirurgo orale/i,"ATM"],
];
function dominioPerSpecialista(nome){
  if(!nome)return null;
  for(const [re,dom] of SPECIALISTA_DOMINIO_MAP){if(re.test(nome))return dom;}
  return null;
}
function flagsDaSpecialisti(anamnesiList,odontoList,fisioList){
  const out=[];const add=(dominio,etichetta,dettaglio,fonte)=>out.push({dominio,livello:"giallo",etichetta,dettaglio:dettaglio||"",fonte});
  (anamnesiList||[]).forEach(d=>{const dom=dominioPerSpecialista(d.specialista);if(dom&&d.specialista)add(dom,"Diagnosi pregressa: "+d.specialista,(d.files&&d.files.length?d.files.length+" documento/i allegato/i.":""),"Anamnesi");});
  (odontoList||[]).forEach(d=>{const dom=dominioPerSpecialista(d.specialista);if(dom&&d.specialista)add(dom,"Diagnosi "+d.specialista+" riferita",d.sintesi||"","Odontoiatra");});
  (fisioList||[]).forEach(d=>{const dom=dominioPerSpecialista(d.specialista);if(dom&&d.specialista)add(dom,"Diagnosi "+d.specialista+" riferita",d.sintesi||"","Fisioterapista");});
  return out;
}

/* ===== Altri specialisti da consultare =====
   Incrocia anamnesi + esame odontoiatrico + esame fisioterapico dell'ultima visita
   per suggerire figure esterne al percorso SSDC (non sostituisce il giudizio clinico). */
function suggerisciSpecialisti(allFlags,answers,lastVisit){
  const out=[];const add=(spec,livello,motivo)=>out.push({spec,livello,motivo});
  const has=(etichetta)=>allFlags.some(f=>f.etichetta===etichetta);
  const hasPrefix=(re)=>allFlags.some(f=>re.test(f.etichetta));
  if(has("Sospetta apnea notturna (OSAS)"))add("Otorinolaringoiatra / Centro del sonno","rosso","Sospette apnee notturne riferite in anamnesi: utile un approfondimento specialistico del sonno.");
  if(answers.salute_orl&&answers.salute_orl.some(x=>x!=="nessuna"))add("Otorinolaringoiatra","giallo","Storia di otiti, tonsilliti, adenoidi o sinusiti riferita in anamnesi.");
  if(has("Trauma con perdita di coscienza"))add("Neurologo","rosso","Trauma cranico con perdita di coscienza riferito: valutazione prioritaria.");
  if(has("Cluster vertigini + cefalea"))add("Neurologo / Otorinolaringoiatra","rosso","Vertigini associate a cefalea: da approfondire per la componente vestibolare/neurologica.");
  if(has("NPC > 10 cm"))add("Optometrista / Ortottista","giallo","Insufficienza di convergenza rilevata al test NPC: utile una valutazione visiva.");
  if(hasPrefix(/^Anchiloglossia/))add("Chirurgo orale / Logopedista","giallo","Frenulo linguale corto (anchiloglossia): valutare eventuale frenulectomia e/o rieducazione logopedica.");
  if(answers.deglutizione_atipica==="si")add("Logopedista","giallo","Sospetta deglutizione atipica riferita: una rieducazione mio-funzionale puo essere utile.");
  const of=lastVisit.odontoiatra||{};
  if(Array.isArray(of.lingua_forma)&&of.lingua_forma.some(x=>x==="Tonsilla ipertrofica"||x==="Patinata"))add("Otorinolaringoiatra / Gastroenterologo","giallo","Aspetto della lingua compatibile con reflusso o ipertrofia tonsillare, da approfondire.");
  const ff=lastVisit.fisioterapista||{};
  if(Array.isArray(ff.viscerali)&&ff.viscerali.length>0)add("Osteopata viscerale / Gastroenterologo","giallo","Segni di tensione viscerale rilevati durante la valutazione fisioterapica.");
  if((answers.sintomi&&answers.sintomi.includes("dolori_schiena"))||(answers.dolore_sede&&/schiena/i.test(answers.dolore_sede)))add("Ortopedico / Osteopata","giallo","Dolore riferito alla schiena: da inquadrare anche al di fuori dell'ambito stomatognatico.");
  const map={};out.forEach(o=>{if(!map[o.spec]||rank[o.livello]>rank[map[o.spec].livello])map[o.spec]=o;});
  return Object.values(map).sort((a,b)=>rank[b.livello]-rank[a.livello]);
}
const L={respiro:{naso:"nasale",bocca:"orale",misto:"misto"},mast:{entrambi:"bilaterale equilibrata",dx:"prevalente a destra",sx:"prevalente a sinistra"},durata:{meno_1_mese:"<1 mese","1_6_mesi":"1-6 mesi",oltre_6_mesi:">6 mesi",anni:"anni"}};
function reportClinico(a,flags){const odo=[],mss=[];
  if(a.respiro_giorno)odo.push("Respirazione diurna "+(L.respiro[a.respiro_giorno]||a.respiro_giorno)+(a.naso_chiuso==="si"?" (naso spesso chiuso)":"")+".");
  if(a.bruxismo==="si")odo.push("Bruxismo/serramento riferito"+(a.bruxismo_mattino==="si"?", con sintomi mattutini.":"."));
  if(a.masticazione)odo.push("Masticazione "+(L.mast[a.masticazione]||a.masticazione)+".");
  if(a.deglutizione_atipica==="si")odo.push("Sospetta deglutizione atipica (spinta linguale).");
  if(a.abitudini&&a.abitudini.some(x=>x!=="nessuna"))odo.push("Abitudini viziate: "+a.abitudini.filter(x=>x!=="nessuna").join(", ")+".");
  if(a.salute_orl&&a.salute_orl.some(x=>x!=="nessuna"))odo.push("Storia ORL: "+a.salute_orl.filter(x=>x!=="nessuna").join(", ")+".");
  if((a.esami_files&&a.esami_files.length)||(a.esami_paths&&a.esami_paths.length))odo.push("Allegati: "+((a.esami_files||a.esami_paths).length)+" file.");
  if(a.obiettivi&&a.obiettivi.length)odo.push("Obiettivi paziente: "+a.obiettivi.join(", ")+".");
  if(!odo.length)odo.push("Nessun elemento odontoiatrico di rilievo riferito.");

  if(sint.length)mss.push("Sintomi riferiti: "+sint.join(", ")+(a.nrs!=null?" - NRS "+a.nrs+"/10":"")+(a.dolore_durata?", durata "+L.durata[a.dolore_durata]:"")+".");
  if(a.dolore_sede&&a.dolore_sede.length){const sedi=(Array.isArray(a.dolore_sede)?a.dolore_sede:String(a.dolore_sede).split(",")).map(x=>String(x).trim()).filter(Boolean);if(sedi.length)mss.push("Sede del dolore: "+sedi.join(", ")+".");}
  if(a.trauma==="si")mss.push("Trauma cranio-cervicale pregresso"+(a.trauma_incoscienza==="si"?" con perdita di coscienza":"")+(a.trauma_dettaglio?": "+a.trauma_dettaglio:"")+".");
  if(a.attivita_sportiva&&a.attivita_sportiva!=="nessuna")mss.push("Attivita sportiva "+a.attivita_sportiva.replace("_"," ")+(a.sport_quale?" ("+a.sport_quale+")":"")+".");

function ageFrom(d){if(!d)return null;const b=new Date(d),n=new Date();let x=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))x--;return x;}
/* ===== motore di interpretazione clinica (esame + sEMG) =====
   Trasforma i dati inseriti dai clinici in flag che alimentano la griglia. */
function computeClinicalFlags(val){
  const f=[]; const add=(d,l,e,det,fonte)=>f.push({dominio:d,livello:l,etichetta:e,dettaglio:det||"",fonte});
  const o=val.odontoiatra||{}, fi=val.fisioterapista||{}, se=(val.semg||{}).pre||{};
  const N=x=>{const n=parseFloat(x);return isNaN(n)?null:n;};
  // --- Odontoiatra ---
  if(o.eccentrici==="Interferenza posteriore")add("Occlusione","giallo","Interferenza posteriore (eccentrici)","Mantiene i masseteri in iper-attivazione; ostacola il rilascio miofasciale.","Odontoiatra");
  if(o.slide===">2 mm")add("Occlusione","rosso","Slide RC–OC > 2 mm","Instabilita occlusale significativa (comune nei DTM).","Odontoiatra");
  else if(o.slide==="1–2 mm")add("Occlusione","giallo","Slide RC–OC 1–2 mm","Discrepanza da verificare (usura, dolore ATM).","Odontoiatra");
  if(o.crossbite&&o.crossbite!=="Assente")add("Occlusione","giallo","Crossbite "+o.crossbite,"Discrepanza trasversale.","Odontoiatra");
  const clickDx=o.atm_click_dx&&o.atm_click_dx!=="No", clickSx=o.atm_click_sx&&o.atm_click_sx!=="No";
  const dolAtm=o.atm_dolore_dx==="Si"||o.atm_dolore_sx==="Si"; const ap=N(o.apertura);
  if(dolAtm||((clickDx||clickSx)&&ap!=null&&ap<40))add("ATM","rosso","Disfunzione ATM clinica","Click/dolore con possibile limitazione dell'apertura.","Odontoiatra");
  else if(clickDx||clickSx)add("ATM","giallo","Click articolare rilevato","Monitorare dinamica condilo-discale.","Odontoiatra");
  if(ap!=null&&ap<40)add("ATM","giallo","Apertura limitata (<40 mm)","Possibile blocco articolare/contrattura.","Odontoiatra");
  if(o.usura==="Marcata")add("Bruxismo","giallo","Usura dentale marcata","Segno di bruxismo/serramento.","Odontoiatra");
  if(o.palato==="Stretto/ogivale")add("Respirazione","giallo","Palato stretto/ogivale","Spesso associato a respiro orale; base trasversale ridotta.","Odontoiatra");
  if(o.frenulo_ling==="Kotlow III"||o.frenulo_ling==="Kotlow IV")add("Occlusione","giallo","Anchiloglossia ("+o.frenulo_ling+")","Limita la funzione linguale; valutare spinta/recidiva.","Odontoiatra");
  // --- Fisioterapista ---
  if(fi.romberg==="Positivo")add("Postura","giallo","Romberg positivo","Deficit propriocettivo/vestibolare: instabilita posturale.","Fisioterapista");
  if(fi.fukuda_rot==="DX >30°"||fi.fukuda_rot==="SX >30°")add("Postura","giallo","Fukuda rotazione >30°","Asimmetria del controllo posturale dinamico.","Fisioterapista");
  if(N(fi.npc_bp)!=null&&N(fi.npc_bp)>10)add("Cervicale","giallo","NPC > 10 cm","Insufficienza di convergenza; possibile compenso posturale.","Fisioterapista");
  if(fi.crlf&&fi.crlf!=="Libero")add("Cervicale","giallo","Prima costa: "+fi.crlf,"Ipomobilita della prima costa (CRLF).","Fisioterapista");
  if(fi.cfrt&&fi.cfrt!=="Libero")add("Cervicale","rosso","CFRT positivo ("+fi.cfrt+")","Sospetta cefalea cervicogenica (C1–C2).","Fisioterapista");
  if(fi.respirazione==="Clavicolare-alta")add("Respirazione","giallo","Respiro clavicolare alto","Sovraccarico dei muscoli accessori del collo.","Fisioterapista");
  if(fi.glatzel==="Scarso")add("Respirazione","giallo","Glatzel: flusso scarso","Ridotta pervieta nasale.","Fisioterapista");
  const trigMast=Math.max(N(fi.nrs_mass_dx)||0,N(fi.nrs_mass_sx)||0,N(fi.nrs_temp_dx)||0,N(fi.nrs_temp_sx)||0);
  if(trigMast>=5)add("Bruxismo","giallo","Trigger point masticatori (NRS "+trigMast+"/10)","Dolorabilita su masseteri/temporali.","Fisioterapista");
  const trigScom=Math.max(N(fi.nrs_scom_dx)||0,N(fi.nrs_scom_sx)||0);
  if(trigScom>=5)add("Cervicale","giallo","Trigger point SCOM (NRS "+trigScom+"/10)","Tensione cervicale anteriore.","Fisioterapista");
  if(fi.chewing_spinta==="Si")add("Occlusione","giallo","Spinta linguale (chewing test)","Parafunzione linguale confermata.","Fisioterapista");
  if(fi.chewing_cicli==="Asimmetrici")add("Occlusione","giallo","Cicli masticatori asimmetrici","Carico masticatorio non bilanciato.","Fisioterapista");
  // --- sEMG (pre trattamento) ---
  if(N(se.poc_medio)!=null&&N(se.poc_medio)<80){add("Occlusione","giallo","POC medio < 80%","Asimmetria funzionale di contrazione TA/MM.","sEMG");add("Postura","giallo","POC medio < 80%","Cercare asimmetria di carico (Romberg/Fukuda).","sEMG");}
  if(N(se.poc_ta)!=null&&N(se.poc_ta)<80)add("Cervicale","giallo","POC TA < 80%","Guida monolaterale: correlato a cefalee e tensioni sotto-occipitali.","sEMG");
  if(N(se.poc_mm)!=null&&N(se.poc_mm)<80)add("Occlusione","giallo","POC MM < 80%","Masticazione prevalente da un lato.","sEMG");
  if(N(se.impact)!=null&&N(se.impact)>120)add("Bruxismo","rosso","IMPACT > 120% (ipertono)","Serramento/bruxismo con trigger point attivi. Valutare deprogrammazione (JIG) o AMCOP.","sEMG");
  else if(N(se.impact)!=null&&N(se.impact)<80)add("Dolore","giallo","IMPACT < 80% (inibizione)","Possibile dolore o ipotonia.","sEMG");
  if(N(se.asimmetria)!=null&&Math.abs(N(se.asimmetria))>10)add("Postura","giallo","Asimmetria > 10%","Baricentro muscolare spostato: il sistema pende da un lato.","sEMG");

async function fetchPatients(token){const sel="id,created_at,percorso,answers,nome,cognome,data_nascita,sesso,email,telefono";
  const r=await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=${sel}&order=created_at.desc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token}});
  if(!r.ok)throw new Error("Lettura dati non riuscita (verifica utente in tabella staff)");
  return (await r.json()).map(x=>({id:x.id,created_at:x.created_at,percorso:x.percorso,answers:x.answers||{},nome:x.nome,cognome:x.cognome,data_nascita:x.data_nascita,sesso:x.sesso,email:x.email,telefono:x.telefono}));}

/* ===== campo clinico generico ===== */
function ClinField({f,val,set}){
  if(f.t==="grp")return <div className="grp">{f.l}</div>;
  const v=val[f.n]; const noteKey=f.n+"__nota"; const note=val[noteKey]||"";
  const [openNote,setOpenNote]=useState(!!note);
  return (<div className={"f"+(f.wide?" wide":"")}>
    <label>{f.l}</label>
    {f.t==="text"&&<input value={v||""} onChange={e=>set(f.n,e.target.value)} />}
    {f.t==="list"&&<input value={Array.isArray(v)?v.join(","):(v||"")} onChange={e=>set(f.n,e.target.value===""?[]:e.target.value.split(","))} />}
    {f.t==="number"&&<div className="num"><input type="number" value={v||""} onChange={e=>set(f.n,e.target.value)} style={{maxWidth:130}} />{f.u&&<span className="u">{f.u}</span>}</div>}
    {f.t==="textarea"&&<textarea value={v||""} onChange={e=>set(f.n,e.target.value)} />}
    {f.t==="radio"&&<div className="optrow">{f.o.map(o=>{const val=Array.isArray(o)?o[0]:o;const lab=Array.isArray(o)?o[1]:o;return <button key={val} className={"optbtn"+(v===val?" on":"")} onClick={()=>set(f.n,v===val?"":val)}>{lab}</button>;})}</div>}
    {f.t==="multi"&&<div className="optrow">{f.o.map(o=>{const val=Array.isArray(o)?o[0]:o;const lab=Array.isArray(o)?o[1]:o;const arr=Array.isArray(v)?v:[];const on=arr.includes(val);return <button key={val} className={"optbtn"+(on?" on":"")} onClick={()=>set(f.n,on?arr.filter(x=>x!==val):[...arr,val])}>{lab}</button>;})}</div>}
    {f.t==="scale10"&&<div className="optrow">{[...Array(11)].map((_,i)=><button key={i} className={"optbtn"+(String(v)===String(i)?" on":"")} onClick={()=>set(f.n,i)}>{i}</button>)}</div>}
    {f.h&&<div className="h">{f.h}</div>}
    {f.t!=="textarea"&&<div className="fnote">
      {(openNote||note)
        ?<input className="noteinput" placeholder="Nota clinica su questa voce…" value={note} onChange={e=>set(noteKey,e.target.value)} />
        :<button className="notebtn" onClick={()=>setOpenNote(true)}>{"✎"} Aggiungi nota</button>}
    </div>}
  </div>);
}

function DiagnosiDocumenti({list,onChange,patientId,token}){

      {(it.files||[]).length>0&&<div className="doclist">{it.files.map((f,fi)=>(<div className="exam" key={fi}><span className="fi">{(f.name.split(".").pop()||"").toUpperCase().slice(0,4)}</span><span onClick={()=>openFile(f)} style={{cursor:"pointer",textDecoration:"underline"}}>{f.name}</span><button className="notebtn" onClick={()=>removeFile(i,fi)}>{"✕"}</button></div>))}</div>}
    </div>))}

function hasData(o){return o&&Object.keys(o).some(k=>{const v=o[k];return v!=null&&v!==""&&!(Array.isArray(v)&&v.length===0);});}

/* raccoglie le note voce-per-voce (per stampa/report) */
function collectNotes(val){const out=[];[["Odontoiatra",ODO,(val.odontoiatra||{})],["Fisioterapista",FISIO,(val.fisioterapista||{})]].forEach(([sez,fields,data])=>{fields.forEach(f=>{if(f.t==="grp")return;const n=data[f.n+"__nota"];if(n)out.push({sez,label:f.l,nota:n});});});return out;}

/* confronta i dati di due visite per un dato set di campi (ODO o FISIO) e restituisce le differenze */
function diffFields(fields,a,b){
  a=a||{};b=b||{};const out=[];
  fields.forEach(f=>{
    if(f.t==="grp")return;
    const av=a[f.n],bv=b[f.n];
    const an=Array.isArray(av)?av.join(", "):(av==null?"":String(av));
    const bn=Array.isArray(bv)?bv.join(", "):(bv==null?"":String(bv));
    if(an!==bn)out.push({label:f.l,a:an||"—",b:bn||"—"});
  });
  return out;
}

/* ===== Inquadramento assistito (IA) — supporto alla decisione, NON diagnosi ===== */
async function callAI(payload){
  const prompt=
"Sei un sistema di supporto alle decisioni cliniche (SSDC) per uno studio interdisciplinare di odontoiatria e fisioterapia. "+
"NON formulare diagnosi definitive: fornisci un INQUADRAMENTO del caso e IPOTESI DI LAVORO su cui sara il clinico a decidere. "+
"Ogni ipotesi deve iniziare con 'Possibile' o 'Compatibile con'. Segnala eventuali bandiere rosse e, se presenti, raccomanda invio a valutazione medica. "+
"Usa lingua italiana, tono professionale e sintetico.\n\n"+
"DATI DEL CASO (JSON):\n"+JSON.stringify(payload)+"\n\n"+
"Rispondi SOLO con un oggetto JSON valido, senza testo aggiuntivo ne backtick, con questo schema:\n"+
'{"sintesi":"string (2-3 frasi)","odontoiatrico":{"ipotesi":["..."],"da_confermare":["..."]},"fisioterapico":{"ipotesi":["..."],"da_confermare":["..."]},"correlazioni":["..."],"red_flags":["..."],"priorita":["..."]}';
  const endpoint=AI_PROXY_URL||"https://api.anthropic.com/v1/messages";
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  if(!r.ok) throw new Error("Servizio IA non raggiungibile (HTTP "+r.status+").");
  const data=await r.json();
  const text=(data.content||[]).map(i=>i.text||"").join("\n");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}
